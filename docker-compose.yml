services:
  postgres:
    image: postgres:16-alpine
    container_name: legalmetro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: legalmetro
      POSTGRES_PASSWORD: legalmetro123
      POSTGRES_DB: legalmetro_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalmetro -d legalmetro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legalmetro_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: legalmetro_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalmetro_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://legalmetro:legalmetro123@postgres:5432/legalmetro_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: legalmetro-storage
      MINIO_SECURE: "False"
      STORAGE_LOCAL_DIR: /app/storage_data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage_data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalmetro_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info -c 2
    environment:
      DATABASE_URL: postgresql://legalmetro:legalmetro123@postgres:5432/legalmetro_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: legalmetro-storage
      MINIO_SECURE: "False"
      STORAGE_LOCAL_DIR: /app/storage_data
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - backend
      - redis
      - postgres
      - minio
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalmetro_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  backend_storage:
